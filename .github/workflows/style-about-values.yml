name: Style About heading and values

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply CSS overrides
        run: |
          cat >> css/main.css <<'CSS'

          /* About heading + value hover refinement */
          .about-intro .section-title {
            font-size: clamp(2.25rem, 3.35vw, 3.35rem);
            line-height: 1.12;
          }

          .about-value {
            cursor: default;
          }

          .about-value-icon {
            position: relative;
            overflow: hidden;
          }

          .about-value-icon::before {
            content: '';
            position: absolute;
            inset: -35%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.18) 0%, transparent 62%);
            opacity: 0;
            transform: scale(.55);
            transition: opacity .35s ease, transform .45s cubic-bezier(.16,1,.3,1);
          }

          .about-value:hover .about-value-icon::before {
            opacity: 1;
            transform: scale(1);
          }

          .about-value-icon svg {
            position: relative;
            z-index: 1;
            transition: transform .5s cubic-bezier(.16,1,.3,1), filter .35s ease;
          }

          .about-value:hover .about-value-icon svg {
            transform: scale(1.18) rotate(-7deg);
            filter: drop-shadow(0 0 9px currentColor);
          }

          .about-value:nth-child(2):hover .about-value-icon svg {
            transform: scale(1.18) rotate(7deg);
          }

          .about-value:nth-child(3):hover .about-value-icon svg {
            transform: scale(1.18) translateY(-3px) rotate(-9deg);
          }

          .about-value:hover .about-value-icon {
            box-shadow: 0 0 34px rgba(139,92,246,.35), 0 12px 28px rgba(0,0,0,.32);
          }

          .about-value-orange:hover .about-value-icon,
          .about-value:hover .about-value-orange {
            box-shadow: 0 0 34px rgba(255,90,31,.36), 0 12px 28px rgba(0,0,0,.32);
          }

          .about-value strong {
            transition: color .25s ease, transform .35s cubic-bezier(.16,1,.3,1), letter-spacing .3s ease;
          }

          .about-value span {
            transition: color .25s ease, transform .35s cubic-bezier(.16,1,.3,1);
          }

          .about-value:hover strong {
            color: #ffffff;
            transform: translateY(-3px);
            letter-spacing: .01em;
          }

          .about-value:hover span {
            color: #c9ced8;
            transform: translateY(-2px);
          }

          @media (max-width: 768px) {
            .about-intro .section-title {
              font-size: clamp(2rem, 9vw, 3rem);
            }
          }
          CSS

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/main.css
          git rm -f .github/workflows/style-about-values.yml
          git commit -m "Refine About heading and value hover animations"
          git push
